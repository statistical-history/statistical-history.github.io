# ---------------------------------------------------------------------------
# Quarto renders ONLY labs/ and hw/. The root HTML pages are hand-written or
# pre-rendered static pages and are left completely alone -- Quarto copies
# them into _site/ untouched because they aren't in the render list below.
#
# The "!...-key.qmd" exclusions are here pre-emptively, matching the
# instructor-answer-key convention used in the stigler-course repo: once a
# KEY file exists, it must never render to a public page. Keep this even
# before any key file exists.
# ---------------------------------------------------------------------------
project:
  type: website
  render:
    - "labs/*.qmd"
    - "hw/*.qmd"
    - "!labs/*-key.qmd"
    - "!hw/*-key.qmd"
  # Quarto only auto-copies static files it finds referenced from documents it
  # renders (the labs/hw .qmd above). Root pages are plain passthrough HTML
  # that Quarto never parses, so assets/ (CSS, favicon) has
  # to be listed here explicitly or it silently gets left out of _site/.
  # The syllabus source and PDF are copied as downloadable resources too.
  resources:
    - "assets/**"
    - "syllabus/**"

# No website.navbar / website.page-footer here on purpose: Quarto's own
# navbar+footer (Bootstrap/cosmo styled) looked nothing like the hand-written
# site's navy header and footer. format.html.include-before-body/after-body
# below inject the SAME header/footer markup the root HTML pages use
# instead, so labs/hw pages match the rest of the site. See _includes/ and
# assets/css/site-chrome.css.
website:
  title: "STA 119FS — Statistics as a Way of Thinking"
  site-url: "https://statistical-history.github.io"
  repo-url: "https://github.com/statistical-history/statistical-history.github.io"
  repo-actions: [edit, issue]
  page-navigation: true

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    code-overflow: wrap
    include-in-header: _includes/site-head.html
    include-before-body: _includes/site-header.html
    include-after-body: _includes/site-footer.html

execute:
  freeze: auto

editor: visual
