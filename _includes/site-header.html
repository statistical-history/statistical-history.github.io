<script>
  // Quarto's page-columns template nests include-before-body content inside
  // <main>, which is just one column of its TOC/content grid -- our header
  // ends up the same width as the article text and overlapping the "On this
  // page" sidebar instead of spanning the full page. Moving it to be body's
  // first child, outside that grid entirely, is the reliable fix (a pure CSS
  // fix would have to depend on Quarto's internal grid line names, which
  // aren't documented and can change between versions).
  (function () {
    var root = document.getElementById("site-header-root");
    if (root && document.body.firstChild !== root) {
      document.body.insertBefore(root, document.body.firstChild);
    }
  })();
</script>
