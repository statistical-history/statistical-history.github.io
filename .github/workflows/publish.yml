on:
  push:
    branches: main
  pull_request:
    branches: main
  workflow_dispatch:

name: Build and deploy site

# Uses GitHub's native Actions -> Pages deployment (upload-pages-artifact +
# deploy-pages) rather than pushing to a gh-pages branch. That older approach
# needs `contents: write` on the GITHUB_TOKEN, which this org's Actions
# settings have locked to read-only repo-wide. `pages`/`id-token` are a
# separate permission scope that isn't covered by that lock.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Ubuntu mirrors and bound APT retries
        shell: bash
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "1";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF

      - name: Install Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        timeout-minutes: 10
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Add packages here as labs/hw start using them, e.g. c("tidyverse", "HistData").
      - name: Install R packages used by labs/hw
        run: install.packages(c("tidyverse"))
        shell: Rscript {0}

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
